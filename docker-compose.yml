# Admin dashboard only. Do not start the adidas-microservices stack from this file.
services:
  admin:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PORT: "5000"
      HOSTNAME: "0.0.0.0"
      BETTER_AUTH_URL: http://localhost:5000
      NEXT_PUBLIC_BASE_URL: http://localhost:5000
      NEXT_PUBLIC_RAILS_API_URL: http://localhost:3000/api
      NEXT_PUBLIC_AUTH_SERVICE_URL: http://localhost:9000/api
      DATABASE_URL: postgresql://adidas:adidas_local@host.docker.internal:5432/adidas_auth_prod
      PRISMA_DATABASE_URL: postgresql://adidas:adidas_local@host.docker.internal:5432/adidas_product_prod
    volumes:
      - .:/app
      - admin_node_modules:/app/node_modules
      - admin_next:/app/.next
    command: sh -c "npx prisma generate && npm run dev"
    networks:
      - adidas-admin

volumes:
  admin_node_modules:
  admin_next:

networks:
  adidas-admin:
    driver: bridge
